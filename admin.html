:root{
  --ink:      #16213E;
  --ink-soft: #3A4468;
  --paper:    #F7F2E7;
  --card:     #FFFDF8;
  --amber:    #E2A33B;
  --amber-deep: #B9791F;
  --ember:    #C1572B;
  --moss:     #4B6357;
  --line:     #E3D9C4;
  --shadow:   rgba(22,33,62,0.10);
  --focus:    #2F6FED;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:      #F3EEE1;
    --ink-soft: #C4BDA9;
    --paper:    #10152A;
    --card:     #171E38;
    --amber:    #F0B65C;
    --amber-deep: #F7CA82;
    --ember:    #E17A4C;
    --moss:     #8FB0A0;
    --line:     #2B3255;
    --shadow:   rgba(0,0,0,0.35);
    --focus:    #7EA6FF;
  }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh;
  background:var(--paper);
  color:var(--ink);
  font-family:'Karla',ui-sans-serif,system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.page{ width:100%; max-width:480px; }

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:36px 32px 32px;
  box-shadow:0 20px 50px -20px var(--shadow);
}

.eyebrow{
  font-size:12px;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--moss);
}

h1.title{
  font-family:'Karla',sans-serif;
  font-weight:800;
  font-size:20px;
  line-height:1.3;
  margin:6px 0 0;
  letter-spacing:-.01em;
}

.subtitle{
  margin-top:8px;
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.5;
}

form{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field label{
  font-size:11px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
.field .hint{
  font-size:12px;
  color:var(--ink-soft);
  font-weight:400;
  text-transform:none;
  letter-spacing:0;
}
.field input{
  font-family:'Karla',sans-serif;
  font-size:15px;
  font-weight:500;
  color:var(--ink);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  font-variant-numeric:tabular-nums;
  width:100%;
}
.field input:focus-visible{
  outline:2px solid var(--focus);
  outline-offset:1px;
}

.field-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--ink-soft);
}
.checkbox-row input{ width:auto; }

.divider{
  height:1px;
  background:var(--line);
  margin:6px 0;
  border:0;
}

.save-btn{
  font-family:'Karla',sans-serif;
  font-weight:700;
  font-size:14px;
  color:var(--card);
  background:var(--ink);
  border:0;
  border-radius:10px;
  padding:13px 18px;
  cursor:pointer;
}
.save-btn:hover{ background:var(--amber-deep); }
.save-btn:disabled{ opacity:.5; cursor:default; }

.status{
  font-size:13px;
  color:var(--ink-soft);
  min-height:18px;
  margin:0;
}
.status.is-error{ color:var(--ember); }
.status.is-success{ color:var(--moss); }

.view-link{
  margin-top:18px;
  font-size:13px;
  text-align:center;
}
.view-link a{ color:var(--ink-soft); }
</style>
</head>
<body>
<main class="page">
  <div class="card">
    <div class="eyebrow">Fundraiser Admin</div>
    <h1 class="title">Update the numbers</h1>
    <p class="subtitle">Changes here publish straight to the live tracker within about a minute.</p>

    <form id="adminForm">
      <div class="field">
        <label for="fToken">GitHub token</label>
        <input id="fToken" type="password" autocomplete="off" placeholder="github_pat_...">
        <span class="hint">Only used in your browser to talk to GitHub directly &mdash; never sent anywhere else.</span>
      </div>

      <div class="checkbox-row">
        <input id="fRemember" type="checkbox">
        <label for="fRemember">Remember this token on this device</label>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="fName">Campaign name</label>
        <input id="fName" type="text" maxlength="80" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="fRaised">Amount raised</label>
          <input id="fRaised" type="number" min="0" step="1" inputmode="decimal" required>
        </div>
        <div class="field">
          <label for="fGoal">Goal</label>
          <input id="fGoal" type="number" min="1" step="1" inputmode="decimal" required>
        </div>
      </div>

      <button type="submit" class="save-btn" id="saveBtn">Save &amp; publish</button>
      <p class="status" id="statusEl" role="status"></p>
    </form>

    <p class="view-link"><a href="index.html">&larr; View the live tracker</a></p>
  </div>
</main>
<script>
var OWNER = 'AbbyandOwen';
var REPO = 'fundraiser';
var PATH = 'data.json';
var API = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH;
var TOKEN_KEY = 'fundraiser_admin_token';

var tokenEl = document.getElementById('fToken');
var rememberEl = document.getElementById('fRemember');
var nameEl = document.getElementById('fName');
var raisedEl = document.getElementById('fRaised');
var goalEl = document.getElementById('fGoal');
var saveBtn = document.getElementById('saveBtn');
var statusEl = document.getElementById('statusEl');
var form = document.getElementById('adminForm');

try {
  var savedToken = localStorage.getItem(TOKEN_KEY);
  if (savedToken) {
    tokenEl.value = savedToken;
    rememberEl.checked = true;
  }
} catch (e) {}

function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(str){
  return decodeURIComponent(escape(atob(str)));
}

function setStatus(text, kind){
  statusEl.textContent = text;
  statusEl.className = 'status' + (kind ? ' is-' + kind : '');
}

function loadCurrent(){
  var token = tokenEl.value.trim();
  if (!token){ return; }
  setStatus('Loading current values…');
  fetch(API, {
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
  }).then(function(r){
    if (!r.ok) throw { status: r.status };
    return r.json();
  }).then(function(data){
    var content = JSON.parse(b64DecodeUtf8(data.content.replace(/\n/g, '')));
    nameEl.value = content.title;
    raisedEl.value = content.raised;
    goalEl.value = content.goal;
    setStatus('');
  }).catch(function(err){
    if (err && err.status === 401){
      setStatus('That token was rejected. Check it and try again.', 'error');
    } else if (err && err.status === 404){
      setStatus('Token works, but repo/file not found. Check OWNER/REPO in this page.', 'error');
    } else {
      setStatus('Could not load current values — check the token and your connection.', 'error');
    }
  });
}

tokenEl.addEventListener('change', loadCurrent);
if (tokenEl.value) loadCurrent();

form.addEventListener('submit', function(ev){
  ev.preventDefault();

  var token = tokenEl.value.trim();
  if (!token){ setStatus('Paste your GitHub token first.', 'error'); return; }

  var name = nameEl.value.trim();
  var raised = parseFloat(raisedEl.value);
  var goal = parseFloat(goalEl.value);

  if (!name){ setStatus('Give the campaign a name.', 'error'); return; }
  if (!(goal > 0)){ setStatus('Goal must be greater than zero.', 'error'); return; }
  if (!(raised >= 0)){ setStatus("Amount raised can't be negative.", 'error'); return; }

  try {
    if (rememberEl.checked) localStorage.setItem(TOKEN_KEY, token);
    else localStorage.removeItem(TOKEN_KEY);
  } catch (e) {}

  saveBtn.disabled = true;
  setStatus('Publishing…');

  var newState = {
    title: name,
    raised: raised,
    goal: goal,
    updatedAt: new Date().toISOString()
  };

  fetch(API, {
    headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
  }).then(function(r){
    if (!r.ok) throw { status: r.status };
    return r.json();
  }).then(function(current){
    var body = {
      message: 'Update data.json via admin page',
      content: b64EncodeUtf8(JSON.stringify(newState, null, 2) + '\n'),
      sha: current.sha
    };
    return fetch(API, {
      method: 'PUT',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
  }).then(function(r){
    if (!r.ok) throw { status: r.status };
    return r.json();
  }).then(function(){
    saveBtn.disabled = false;
    setStatus('Published! Live on the tracker within about a minute.', 'success');
  }).catch(function(err){
    saveBtn.disabled = false;
    if (err && err.status === 401){
      setStatus('That token was rejected. Check it and try again.', 'error');
    } else if (err && err.status === 403){
      setStatus("Token doesn't have write access to this repo.", 'error');
    } else if (err && err.status === 409){
      setStatus('Someone/something else just changed the file — reload and try again.', 'error');
    } else {
      setStatus('Could not publish — check the token and your connection.', 'error');
    }
  });
});
</script>
</body>
</html>
